<!DOCTYPE html>
<html>
  <head>
    <meta charset = "UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
    <style>
      html{
        min-height: 100%
      }
      .avatar-image {
        width: 128px;
        height: 128px;
        object-fit: cover;
        border-radius: 128px;
        display: flex;
        justify-content:center;
        align-items: center;
        margin: 0 auto;
      }
      body {
        min-height: 100%;
        padding-top: 40px;
        padding-bottom: 40px;
        background: linear-gradient(15deg, #142850, #14365f, #13476f, #125d80, #107792, #0d96a5, #09b8b4, #04ccb1); /* made at https://learnui.design/tools/gradient-generator.html */
        color: rgba(255,255,255,1.0);
      }
      a {
        color: rgba(255,255,255,1.0);
        text-align: center;
        vertical-align: middle;
        text-decoration: none;
      }
      .thumbnail{
        width: 60px;
        height: 60px;
        border-radius: 60px;
        object-fit: cover;
      }
      
      .image-row {
        margin-bottom: 20px;
        text-align: center;
      }
      .social-icons-row {
        margin-bottom: 30px;
        margin-top: 30px;
        display: flex;
        justify-content: space-around;
      }
      .name-row{
        margin-bottom: 30px;
        margin-top: 30px;
        text-align: center;
        font-family: "Georgia";
        font-size: 16px;
        font-weight: 800;
      }
      .main-container{
        max-width: 640px;
        margin: auto;
      }
      .item{
        background-color: rgba(255,255,255,0.2);
        padding-top: 20px;
        padding-left: 20px;
        padding-bottom: 20px;
        padding-right: 20px;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        text-align: center;
        gap: 30px;
        border-radius:1000px;
        box-shadow: 0px 4px 10px 2px rgba(4,204,177,0.6)
      }
      .link-text{
        text-align: center;
        flex-grow: 1;
        font-weight: 400;
        padding-right: 85px;
      }
    </style>
  </head>
  <body>
      <div class ="main-container">
        <div class = "image-row">
          <img class = "avatar-image" src = "Upstate ny.jpg" alt = "NY State Landscape">
        <div class = "name-row">
          <b>Upstate NY Vacation Rentals</b>
        <div class = "social-icons-row">
          <a class = "social-links" href="https://www.airbnb.com" target = "_blank"><i class="fa-brands fa-airbnb"></i> Home </a>
          <a class = "social-links" href="https://www.linkedin.com/in/thomas-tj-ball/" target = "_blank"> <i class="fa-solid fa-phone-volume"></i> Host</a>
        </div>
        <div class = "links-row">
          <div class = "item">
            <img class = "thumbnail" src = "68 pic.png" alt = "68 Charles Home Photo">
            <a class = "link-text" href="https://www.airbnb.com/rooms/872271488342580842?guests=1&adults=1&s=67&unique_share_id=024df3fd-bc9d-40ba-ae2d-98e88966a634" target = "_blank">68 Charles St</a>
          </div>
          <div class = "item">
            <img class = "thumbnail" src = "9307 pic.png" alt = "9307 NY-96 Living Room Photo">
            <a class = "link-text" href="https://www.airbnb.com/rooms/1153729566881475211?guests=1&adults=1&s=67&unique_share_id=b002ff28-1b11-4c62-a998-43f09a126eb2" target = "_blank">9307 NY-96</a>
          </div>
          <div class = "item">
            <img class = "thumbnail" src = "1283 pic.png" alt = "1283 Yard Photo">
            <a class = "link-text" href="https://www.airbnb.com/rooms/668278533077341393?guests=1&adults=1&s=67&unique_share_id=97abd841-3643-4d4f-9288-676e1bc9329b" target = "_blank"> 1283 Burdick Rd</a>
          </div>
          <div class = "item">
            <img class = "thumbnail" src = "1579 pic.png" alt = "1579 Bedroom Photo">
            <a class = "link-text" href="https://www.airbnb.com/rooms/1223304687478693623?guests=1&adults=1&s=67&unique_share_id=e491a046-e200-4c5e-8480-c1a0dcfbdf1d" target = "_blank"> 1579 Cortland St</a>
          </div>
        </div>
  </body>
</html>
